<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub 图床</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#171717;font:16px system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:14px}h1{font-size:25px;margin:0 0 5px}.muted{color:#6b7280;font-size:13px}.drop{border:2px dashed #cbd5e1;border-radius:16px;padding:28px 14px;text-align:center;background:#fafafa}input[type=file]{display:none}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700}.primary{background:#111827;color:#fff}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.item{border-top:1px solid #eee;padding:12px 0}.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px}.name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{margin-top:10px;font-size:13px}</style></head><body><main><div class="card"><h1>GitHub 图床</h1><div class="muted">Cloudflare Workers · GitHub 存储</div></div><div class="card"><div class="row" style="justify-content:space-between"><b>上传图片</b><span id="limit" class="muted"></span></div><div id="drop" class="drop" style="margin-top:12px"><div style="font-size:34px">＋</div><b>点击选择图片</b><div class="muted">支持多张</div><input id="file" type="file" accept="image/*" multiple></div><div id="status" class="status"></div></div><div class="card"><div class="row" style="justify-content:space-between"><b>图片</b><button class="btn" id="refresh">刷新</button></div><div id="list" class="status">正在读取…</div></div></main><script>const $=s=>document.querySelector(s);let key=localStorage.getItem("imageBedKey")||prompt("请输入 ADMIN_KEY");if(key)localStorage.setItem("imageBedKey",key);const h=()=>({"x-admin-key":key||""});async function api(u,o={}){o.headers={...(o.headers||{}),...h()};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"请求失败");return d}async function load(){try{const[c,a]=await Promise.all([api("/api/config"),api("/api/list")]);$("#limit").textContent=`最大 ${c.maxFileMB} MB/张`;$("#list").innerHTML=a.length?a.map(x=>`<div class=item><div class=row><img class=thumb src="${x.url}"><div class=grow><div class=name>${x.name}</div><div class=row style="margin-top:7px"><button class="btn primary" onclick='copy(${JSON.stringify(x.url)})'>复制URL</button><button class=btn onclick='copy(${JSON.stringify(`![${x.name}](${x.url})`)})'>Markdown</button><button class="btn danger" onclick='del(${JSON.stringify(x.path)},${JSON.stringify(x.sha)})'>删除</button></div></div></div></div>`).join(""):"暂无图片"}catch(e){$("#list").textContent=e.message}}async function up(fs){for(const f of fs){const d=new FormData;d.append("image",f);$("#status").textContent="上传中："+f.name;try{const x=await api("/api/upload",{method:"POST",body:d});$("#status").textContent="上传成功："+x.url;await load()}catch(e){$("#status").textContent=e.message}}}async function del(path,sha){if(!confirm("确定删除？"))return;await api("/api/delete",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({path,sha})});load()}async function copy(s){await navigator.clipboard.writeText(s);alert("已复制")}$("#drop").onclick=()=>$("#file").click();$("#file").onchange=()=>up([...$("#file").files]);$("#refresh").onclick=load;load();</script></body></html>
